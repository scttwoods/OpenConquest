# Fly.io app config. One always-on machine (see PLAN.md §5).
#
# If the app was created via Fly's "Launch from GitHub" flow, deploys happen
# automatically on push to the configured branch. Otherwise, add FLY_API_TOKEN
# (from `fly tokens create deploy`) as a GitHub repo secret so
# .github/workflows/deploy.yml can deploy on push to main.

app = "openconquest"
primary_region = "sjc"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Phase 5 (online PvP) will add a persistent volume for saved games:
#   fly volumes create games_data --size 1
# and then re-add:
# [mounts]
#   source = "games_data"
#   destination = "/data"
