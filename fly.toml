# Fly.io app config. One always-on machine (see PLAN.md §5).
#
# One-time setup on a new Fly account:
#   fly launch --no-deploy     # creates the app; keep this file when prompted
#   fly volumes create games_data --size 1   # persistent storage for PvP saves
#   fly deploy
# Then add FLY_API_TOKEN (from `fly tokens create deploy`) as a GitHub repo
# secret so .github/workflows/deploy.yml can deploy on push to main.

app = "openconquest"
primary_region = "sjc"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "games_data"
  destination = "/data"
