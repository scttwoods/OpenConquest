# fly.toml app configuration file generated for openconquest on 2026-07-03T07:54:28Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'openconquest'
primary_region = 'sjc'

[build]

[[mounts]]
  source = 'games_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
